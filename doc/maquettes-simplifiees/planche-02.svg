al">Catalogue de découverte</text><text x="20" y="356" fill="#39332E" font-family="Arial" font-size="12" font-weight="normal">Un exemple SampleAPIs, chargé à la demande.</text><rect x="20" y="380" width="320" height="44" rx="10" fill="#F0EBE2" stroke="#D4C9BB"/><text x="72.251953125" y="408" fill="#601D30" font-family="Arial" font-size="14" font-weight="bold">Charger un exemple de vin (API)</text><text x="20" y="455" fill="#39332E" font-family="Arial" font-size="13" font-weight="normal">Emporda 2012 · Maselva</text><text x="20" y="501" fill="#72695F" font-family="Arial" font-size="12" font-weight="normal">Projet pédagogique · version 1.0.0</text><text x="20" y="542" fill="#72695F" font-family="Arial" font-size="11" font-weight="normal">L’abus d’alcool est dangereux pour la santé.</text><text x="20" y="560" fill="#72695F" font-family="Arial" font-size="11" font-weight="normal">À consommer avec modération.</text><rect x="20" y="597" width="320" height="44" rx="10" fill="#601D30" stroke="none"/><text x="108.80712890625" y="625" fill="#FBF8F2" font-family="Arial" font-size="14" font-weight="bold">Revenir à mon carnet</text><rect x="0" y="712" width="360" height="88" rx="0" fill="#FBF8F2" stroke="none"/><path d="M50.0 734L59.0 726" stroke="#72695F" stroke-width="1.6" fill="none"/><path d="M59.0 726L68.0 734" stroke="#72695F" stroke-width="1.6" fill="none"/><path d="M53.0 732L53.0 744" stroke="#72695F" stroke-width="1.6" fill="none"/><path d="M53.0 744L65.0 744" stroke="#72695F" stroke-width="1.6" fill="none"/><path d="M65.0 744L65.0 732" stroke="#72695F" stroke-width="1.6" fill="none"/><path d="M57.0 744L57.0 737" stroke="#72695F" stroke-width="1.6" fill="none"/><path d="M57.0 737L61.0 737" stroke="#72695F" stroke-width="1.6" fill="none"/><path d="M61.0 737L61.0 744" stroke="#72695F" stroke-width="1.6" fill="none"/><text x="36.328125" y="771" fill="#72695F" font-family="Arial" font-size="12" font-weight="normal">Mes vins</text><path d="M172.0 735L188.0 735" stroke="#7269